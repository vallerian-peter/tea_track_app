name: tea_track_app
description: "A Tea Tracking App for my tea business"

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  provider: ^6.1.5+1
  get: 
  otp_text_field: ^1.1.2
  http: ^1.1.0
  flutter_secure_storage: ^9.2.2
  intl_phone_field: ^3.1.0
  flutter_rating_bar: ^4.0.1
  url_launcher: ^6.3.1
  nfc_manager: ^4.0.2

  permission_handler: ^12.0.0+1
  fl_chart: ^0.69.0  # Downgraded to fix axisSide error
  carousel_slider: ^5.0.0
  flutter_blue_plus: ^1.31.15 # ^1.35.4 # ^1.31.15
  flutter_form_builder: ^10.1.0

  share_plus: ^11.0.0
  package_info_plus: ^8.0.2
  top_snackbar_flutter: ^3.2.0
  flutter_image_compress: ^2.4.0
  drift: ^2.13.0
  path_provider: ^2.1.5
  path: ^1.9.0
  connectivity_plus: ^6.1.4
  internet_connection_checker_plus: ^2.7.2
  uuid: ^4.5.1
  flutter_localization: ^0.3.2
  icons_plus: ^5.0.0
  flutter_slidable: ^4.0.3
  shared_preferences: ^2.5.6
  smooth_page_indicator: ^3.0.0

  flutter_localizations:
    sdk: flutter
  
  bootstrap_icons: ^1.13.1
  font_awesome_flutter: ^11.0.0
  iconsax_flutter: ^1.0.1
  flutter_markdown: ^0.7.7+1
  flutter_dotenv: ^6.0.1
  mobile_scanner: ^6.0.2

dev_dependencies:
  drift_dev: ^2.13.0
  build_runner: ^2.4.13

  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/
    - assets/fonts/
    - assets/images/
    - assets/logos/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
